name: Contract validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run dependency-free bootstrap validation
        run: python tools/validate_contracts.py
      - name: Validate mapping registry integrity
        run: python tools/mapping_registry.py
      - name: Install public standards validator dependency
        run: python -m pip install --disable-pip-version-check -r requirements-validation.txt
      - name: Run Draft 2020-12 validation
        run: python tools/validate_jsonschema.py
      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -v
