name: Contract validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate contract registry and fixtures
        run: python tools/validate_contracts.py
      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -v
