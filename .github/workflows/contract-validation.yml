name: Contract validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "PASS: exact source commit checked out: $SOURCE_SHA"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - name: Verify immutable workflow action pins
        run: python tools/validate_workflow_pins.py
      - name: Verify validation dependency lock structure
        run: python tools/validate_dependency_lock.py
      - name: Run dependency-free bootstrap validation
        run: python tools/validate_contracts.py
      - name: Validate mapping registry integrity
        run: python tools/mapping_registry.py
      - name: Verify generated schema and mapping references
        run: python tools/generate_reference_docs.py --check
      - name: Smoke-test mapping execution foundation
        run: python tools/mapping_executor.py
      - name: Smoke-test deterministic mapping application
        run: python tools/mapping_application.py
      - name: Smoke-test Adapter SDK boundary
        run: python tools/adapter_sdk.py
      - name: Smoke-test JSON object reference adapter
        run: python adapters/reference/json_object.py tests/fixtures/adapters/json-object-record.json
      - name: Smoke-test JSON Lines reference adapter
        run: python adapters/reference/json_lines.py tests/fixtures/adapters/json-lines-records.jsonl
      - name: Run synthetic end-to-end interoperability proof
        run: python tools/interoperability_pipeline.py
      - name: Install locked public standards validation environment
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-validation.lock
      - name: Verify locked validation environment
        run: |
          python -m pip check
          python tools/validate_dependency_lock.py --verify-installed
      - name: Run Draft 2020-12 validation
        run: python tools/validate_jsonschema.py
      - name: Smoke-test CLI
        run: |
          python tools/meaningwire.py doctor --json
          python tools/meaningwire.py schemas list --json
          python tools/meaningwire.py mappings list --json
          python tools/meaningwire.py proof run --json
      - name: Install locked documentation dependencies
        run: npm ci --no-audit --no-fund
      - name: Build documentation twice and verify deterministic static output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist /tmp/meaningwire-docs-first
          npm run docs:build
          test -f dist/index.html
          test -f dist/how-it-works/index.html
          test -f dist/accessibility/index.html
          test -f dist/standards-crosswalk/index.html
          test -f dist/reference/schemas/index.html
          test -f dist/reference/mappings/index.html
          grep -Fq 'Approval is not transferred.' dist/how-it-works/index.html
          grep -Fq 'does not currently claim WCAG 2.2 AA conformance.' dist/accessibility/index.html
          grep -Fq 'NORMATIVE FOR MEANINGWIRE' dist/standards-crosswalk/index.html
          grep -Fq 'A standards citation is not a mapping.' dist/standards-crosswalk/index.html
          grep -Fq 'Approval is not transferred.' dist/standards-crosswalk/index.html
          grep -Fq 'urn:meaningwire:schema:identity:party:0.1.0' dist/reference/schemas/index.html
          grep -Fq 'urn:meaningwire:mapping:example-crm-email:0.1.0' dist/reference/mappings/index.html
          test -f dist/pagefind/pagefind.js
          cp -a dist /tmp/meaningwire-docs-first
          rm -rf dist
          npm run docs:build
          test -f dist/index.html
          test -f dist/how-it-works/index.html
          test -f dist/accessibility/index.html
          test -f dist/standards-crosswalk/index.html
          test -f dist/reference/schemas/index.html
          test -f dist/reference/mappings/index.html
          grep -Fq 'Approval is not transferred.' dist/how-it-works/index.html
          grep -Fq 'does not currently claim WCAG 2.2 AA conformance.' dist/accessibility/index.html
          grep -Fq 'NORMATIVE FOR MEANINGWIRE' dist/standards-crosswalk/index.html
          grep -Fq 'A standards citation is not a mapping.' dist/standards-crosswalk/index.html
          grep -Fq 'Approval is not transferred.' dist/standards-crosswalk/index.html
          grep -Fq 'urn:meaningwire:schema:identity:party:0.1.0' dist/reference/schemas/index.html
          grep -Fq 'urn:meaningwire:mapping:example-crm-email:0.1.0' dist/reference/mappings/index.html
          test -f dist/pagefind/pagefind.js
          python tools/validate_docs_links.py dist
          python tools/validate_docs_accessibility.py dist
          if ! cmp -s /tmp/meaningwire-docs-first/pagefind/pagefind-ui.css dist/pagefind/pagefind-ui.css; then
            echo "ERROR: Pagefind UI CSS differs across repeated builds." >&2
            sha256sum /tmp/meaningwire-docs-first/pagefind/pagefind-ui.css dist/pagefind/pagefind-ui.css
            echo "--- Pagefind UI CSS unified diff ---"
            diff -u /tmp/meaningwire-docs-first/pagefind/pagefind-ui.css dist/pagefind/pagefind-ui.css || true
            exit 1
          fi
          diff -qr /tmp/meaningwire-docs-first dist
          if find dist -type l -print -quit | grep -q .; then
            echo "ERROR: documentation output contains a symbolic link" >&2
            exit 1
          fi
          echo "PASS: walkthrough, accessibility evidence, standards crosswalk, generated references, and Pagefind bundle exist in byte-identical Starlight output."
      - name: Build candidate twice from exact commit
        shell: bash
        run: |
          set -euo pipefail
          python tools/release_builder.py --output-dir /tmp/meaningwire-first --source-commit "$SOURCE_SHA"
          python tools/release_builder.py --output-dir /tmp/meaningwire-second --source-commit "$SOURCE_SHA"
      - name: Fetch and verify exact official SPDX 2.3 schema
        run: >-
          python tools/fetch_spdx_schema.py --output /tmp/spdx-2.3-schema.json
      - name: Validate both candidate SBOMs and promote release evidence
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          for candidate_dir in /tmp/meaningwire-first /tmp/meaningwire-second; do
            python tools/validate_spdx_sbom.py \
              "${candidate_dir}/MeaningWire-${version}.spdx.json" \
              --schema /tmp/spdx-2.3-schema.json \
              --release-evidence "${candidate_dir}/release-evidence.json" \
              --output-evidence "${candidate_dir}/spdx-validation-evidence.json" \
              --update-release-evidence
          done
      - name: Verify deterministic candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          cmp "/tmp/meaningwire-first/MeaningWire-${version}.tar.gz" "/tmp/meaningwire-second/MeaningWire-${version}.tar.gz"
          cmp "/tmp/meaningwire-first/MeaningWire-${version}.spdx.json" "/tmp/meaningwire-second/MeaningWire-${version}.spdx.json"
          cmp /tmp/meaningwire-first/SHA256SUMS /tmp/meaningwire-second/SHA256SUMS
          cmp /tmp/meaningwire-first/spdx-validation-evidence.json /tmp/meaningwire-second/spdx-validation-evidence.json
          cmp /tmp/meaningwire-first/release-evidence.json /tmp/meaningwire-second/release-evidence.json
      - name: Verify extracted candidate in isolated locked environment
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          candidate="/tmp/meaningwire-first/MeaningWire-${version}.tar.gz"
          (
            cd /tmp/meaningwire-first
            sha256sum -c SHA256SUMS
          )
          rm -rf /tmp/meaningwire-extracted /tmp/meaningwire-venv
          mkdir -p /tmp/meaningwire-extracted
          tar -xzf "$candidate" -C /tmp/meaningwire-extracted
          python -m venv /tmp/meaningwire-venv
          /tmp/meaningwire-venv/bin/python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r "/tmp/meaningwire-extracted/MeaningWire-${version}/requirements-validation.lock"
          (
            cd "/tmp/meaningwire-extracted/MeaningWire-${version}"
            export PYTHONNOUSERSITE=1
            /tmp/meaningwire-venv/bin/python -m pip check
            /tmp/meaningwire-venv/bin/python tools/validate_dependency_lock.py --verify-installed
            /tmp/meaningwire-venv/bin/python tools/meaningwire.py doctor --json
            /tmp/meaningwire-venv/bin/python tools/meaningwire.py proof run --json
            /tmp/meaningwire-venv/bin/python tools/meaningwire.py schema validate \
              urn:meaningwire:schema:identity:party:0.1.0 \
              tests/fixtures/domains/identity/party-person.json --json
          )
      - name: Generate deterministic release-readiness reports
        shell: bash
        run: |
          set -euo pipefail
          for candidate_dir in /tmp/meaningwire-first /tmp/meaningwire-second; do
            python tools/release_readiness.py \
              --candidate-dir "$candidate_dir" \
              --source-commit "$SOURCE_SHA" \
              --fresh-environment-verified \
              --documentation-build-verified \
              --output "${candidate_dir}/release-readiness.json"
          done
          cmp /tmp/meaningwire-first/release-readiness.json /tmp/meaningwire-second/release-readiness.json
      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -v
