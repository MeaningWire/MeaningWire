name: Release candidate build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Check out exact selected ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Verify immutable workflow action pins
        run: python tools/validate_workflow_pins.py

      - name: Verify validation dependency lock structure
        run: python tools/validate_dependency_lock.py

      - name: Install locked public validation environment
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-validation.lock

      - name: Verify locked validation environment
        run: |
          python -m pip check
          python tools/validate_dependency_lock.py --verify-installed

      - name: Validate contracts and registries
        run: |
          python tools/validate_contracts.py
          python tools/mapping_registry.py
          python tools/validate_jsonschema.py

      - name: Run public CLI proof
        run: |
          python tools/meaningwire.py doctor --json
          python tools/meaningwire.py proof run --json

      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -v

      - name: Build candidate twice from exact commit
        shell: bash
        run: |
          set -euo pipefail
          python tools/release_builder.py --output-dir dist/first --source-commit "$GITHUB_SHA"
          python tools/release_builder.py --output-dir dist/second --source-commit "$GITHUB_SHA"

      - name: Fetch and verify exact official SPDX 2.3 schema
        run: >-
          python tools/fetch_spdx_schema.py --output "$RUNNER_TEMP/spdx-2.3-schema.json"

      - name: Validate both candidate SBOMs and promote release evidence
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          for candidate_dir in dist/first dist/second; do
            python tools/validate_spdx_sbom.py \
              "${candidate_dir}/MeaningWire-${version}.spdx.json" \
              --schema "$RUNNER_TEMP/spdx-2.3-schema.json" \
              --release-evidence "${candidate_dir}/release-evidence.json" \
              --output-evidence "${candidate_dir}/spdx-validation-evidence.json" \
              --update-release-evidence
          done

      - name: Verify byte-for-byte reproducibility
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          cmp "dist/first/MeaningWire-${version}.tar.gz" "dist/second/MeaningWire-${version}.tar.gz"
          cmp "dist/first/MeaningWire-${version}.spdx.json" "dist/second/MeaningWire-${version}.spdx.json"
          cmp dist/first/SHA256SUMS dist/second/SHA256SUMS
          cmp dist/first/spdx-validation-evidence.json dist/second/spdx-validation-evidence.json
          cmp dist/first/release-evidence.json dist/second/release-evidence.json

      - name: Verify extracted candidate in isolated locked environment
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          candidate="$GITHUB_WORKSPACE/dist/first/MeaningWire-${version}.tar.gz"
          (
            cd "$GITHUB_WORKSPACE/dist/first"
            sha256sum -c SHA256SUMS
          )
          rm -rf "$RUNNER_TEMP/meaningwire-extracted" "$RUNNER_TEMP/meaningwire-venv"
          mkdir -p "$RUNNER_TEMP/meaningwire-extracted"
          tar -xzf "$candidate" -C "$RUNNER_TEMP/meaningwire-extracted"
          python -m venv "$RUNNER_TEMP/meaningwire-venv"
          "$RUNNER_TEMP/meaningwire-venv/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/meaningwire-extracted/MeaningWire-${version}/requirements-validation.lock"
          (
            cd "$RUNNER_TEMP/meaningwire-extracted/MeaningWire-${version}"
            export PYTHONNOUSERSITE=1
            "$RUNNER_TEMP/meaningwire-venv/bin/python" -m pip check
            "$RUNNER_TEMP/meaningwire-venv/bin/python" tools/validate_dependency_lock.py --verify-installed
            "$RUNNER_TEMP/meaningwire-venv/bin/python" tools/meaningwire.py doctor --json
            "$RUNNER_TEMP/meaningwire-venv/bin/python" tools/meaningwire.py proof run --json
            "$RUNNER_TEMP/meaningwire-venv/bin/python" tools/meaningwire.py schema validate \
              urn:meaningwire:schema:identity:party:0.1.0 \
              tests/fixtures/domains/identity/party-person.json --json
          )

      - name: Generate deterministic release-readiness reports
        shell: bash
        run: |
          set -euo pipefail
          for candidate_dir in dist/first dist/second; do
            python tools/release_readiness.py \
              --candidate-dir "$candidate_dir" \
              --source-commit "$GITHUB_SHA" \
              --fresh-environment-verified \
              --output "${candidate_dir}/release-readiness.json"
          done
          cmp dist/first/release-readiness.json dist/second/release-readiness.json

      - name: Stage verified candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          mkdir -p dist/verified
          cp "dist/first/MeaningWire-${version}.tar.gz" dist/verified/
          cp "dist/first/MeaningWire-${version}.spdx.json" dist/verified/
          cp dist/first/SHA256SUMS dist/verified/
          cp dist/first/release-evidence.json dist/verified/
          cp dist/first/spdx-validation-evidence.json dist/verified/
          cp dist/first/release-readiness.json dist/verified/

      - name: Retain verified candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meaningwire-release-candidate-${{ github.sha }}
          path: dist/verified/
          if-no-files-found: error
          retention-days: 14
