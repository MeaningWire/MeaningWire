name: Docs lockfile bootstrap

on:
  push:
    branches:
      - phase4/starlight-build-foundation

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          package-manager-cache: false
      - name: Resolve exact npm lockfile
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          echo 'MEANINGWIRE_LOCKFILE_GZIP_BASE64_BEGIN'
          gzip -9c package-lock.json | base64 -w0
          echo
          echo 'MEANINGWIRE_LOCKFILE_GZIP_BASE64_END'
