name: Docs lockfile bootstrap

on:
  push:
    branches:
      - phase4/starlight-build-foundation
    paths:
      - package.json

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          package-manager-cache: false
      - name: Resolve exact npm lockfile
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.19.0"
          test "$(npm --version)" = "10.9.3"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
      - name: Commit generated lockfile to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MeaningWire release agent"
          git config user.email "meaningwire@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --exit-code && { echo "package-lock.json unchanged"; exit 0; }
          git commit -m "docs: commit npm-generated lockfile"
          git push origin HEAD:phase4/starlight-build-foundation
