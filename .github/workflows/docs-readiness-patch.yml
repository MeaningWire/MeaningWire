name: Docs readiness patch

on:
  push:
    branches:
      - phase4/starlight-build-foundation
    paths:
      - .github/workflows/docs-readiness-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Apply exact readiness patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/release_readiness.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''    expected_source_commit: str | None = None,\n    fresh_environment_verified: bool = False,\n) -> dict[str, Any]:''',
                  '''    expected_source_commit: str | None = None,\n    fresh_environment_verified: bool = False,\n    documentation_build_verified: bool = False,\n) -> dict[str, Any]:''',
              ),
              (
                  '''    docs_ready, docs_detail = _detect_documentation_site(archive_files)\n    publication_ready, attestation_ready, publication_detail = _detect_publication_path(\n        archive_files\n    )''',
                  '''    docs_scaffold_ready, docs_scaffold_detail = _detect_documentation_site(archive_files)\n    docs_ready = docs_scaffold_ready and documentation_build_verified\n    docs_build_detail = (\n        "locked Starlight scaffold is present and caller asserts the static documentation build passed"\n        if docs_ready\n        else docs_scaffold_detail\n        if not docs_scaffold_ready\n        else "locked Starlight scaffold is present, but successful static documentation build has not been asserted"\n    )\n    publication_ready, attestation_ready, publication_detail = _detect_publication_path(\n        archive_files\n    )''',
              ),
              (
                  '''        "launch_experience": {\n            "status": "PASS" if docs_ready else "BLOCKED",\n            "documentation_site_build": {\n                "status": "PASS" if docs_ready else "BLOCKED",\n                "detail": docs_detail,\n            },\n        },''',
                  '''        "launch_experience": {\n            "status": "PASS" if docs_ready else "BLOCKED",\n            "documentation_site_scaffold": {\n                "status": "PASS" if docs_scaffold_ready else "BLOCKED",\n                "detail": docs_scaffold_detail,\n            },\n            "documentation_site_build": {\n                "status": "PASS" if docs_ready else "BLOCKED",\n                "detail": docs_build_detail,\n            },\n        },''',
              ),
              (
                  '''    parser.add_argument(\n        "--fresh-environment-verified",\n        action="store_true",\n        help="assert that the caller runs after the isolated extracted-candidate proof",\n    )\n    parser.add_argument("--output", help="write machine-readable readiness report JSON")''',
                  '''    parser.add_argument(\n        "--fresh-environment-verified",\n        action="store_true",\n        help="assert that the caller runs after the isolated extracted-candidate proof",\n    )\n    parser.add_argument(\n        "--documentation-build-verified",\n        action="store_true",\n        help="assert that the caller runs only after npm ci and the locked static documentation build succeed",\n    )\n    parser.add_argument("--output", help="write machine-readable readiness report JSON")''',
              ),
              (
                  '''            expected_source_commit=args.source_commit,\n            fresh_environment_verified=args.fresh_environment_verified,\n        )''',
                  '''            expected_source_commit=args.source_commit,\n            fresh_environment_verified=args.fresh_environment_verified,\n            documentation_build_verified=args.documentation_build_verified,\n        )''',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'readiness patch expected one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_release_readiness.py')
          test_text = test_path.read_text(encoding='utf-8')
          anchor = '''    def test_fresh_environment_proof_is_required_for_threshold(self) -> None:\n'''
          addition = '''    def test_verified_documentation_build_clears_launch_blocker(self) -> None:\n        with tempfile.TemporaryDirectory() as directory:\n            candidate_dir, commit = self._validated_candidate(Path(directory))\n            report = release_readiness.evaluate_readiness(\n                candidate_dir,\n                expected_source_commit=commit,\n                fresh_environment_verified=True,\n                documentation_build_verified=True,\n            )\n\n        self.assertEqual(report["release_threshold"]["status"], "PASS")\n        self.assertEqual(report["launch_experience"]["status"], "PASS")\n        self.assertNotIn("documentation_site_build_not_ready", report["blockers"])\n        self.assertEqual(\n            report["blockers"],\n            [\n                "governed_publication_path_not_ready",\n                "public_attestation_path_not_ready",\n            ],\n        )\n        self.assertEqual(report["overall_status"], "BLOCKED")\n\n'''
          if test_text.count(anchor) != 1:
              raise SystemExit('test patch anchor mismatch')
          test_text = test_text.replace(anchor, addition + anchor)
          test_path.write_text(test_text, encoding='utf-8')
          PY
      - name: Run readiness unit tests
        run: python -m unittest tests.test_release_readiness -v
      - name: Commit readiness patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MeaningWire release agent"
          git config user.email "meaningwire@users.noreply.github.com"
          git add tools/release_readiness.py tests/test_release_readiness.py
          git diff --cached --exit-code && { echo "no patch produced"; exit 1; }
          git commit -m "release: require verified documentation build for readiness"
          git push origin HEAD:phase4/starlight-build-foundation
